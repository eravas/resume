name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://eravas.ca/resume/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history, so "Updated <date>" comes from the last resume.yaml commit

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Install Trebuchet MS (Microsoft core fonts, for the PDF)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-list | grep -qi "trebuchet" || { echo "Trebuchet MS missing"; exit 1; }

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0

      - name: Build web résumé + public PDF
        run: python tools/build.py --profile full --pdf public

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: deploy
